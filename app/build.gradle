plugins {
    id 'com.android.application'
}

android {
    namespace 'com.o11a1.videotest'
    compileSdk 35

    defaultConfig {
        applicationId 'com.o11a1.videotest'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    aaptOptions {
        // MediaExtractor needs a real file descriptor, not a compressed asset.
        noCompress 'mp4'
    }
}

tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

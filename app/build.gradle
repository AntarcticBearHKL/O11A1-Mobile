plugins {
    id 'com.android.application'
}

android {
    namespace 'com.o11a1.videotest'
    compileSdk 35

    defaultConfig {
        applicationId 'com.o11a1.videotest'
        minSdk 26
        targetSdk 35
        versionCode 97
        versionName '0.4.79'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs += layout.buildDirectory.dir('generated/webAssets')
        }
    }

    aaptOptions {
        noCompress 'mp4'
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.5.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

def webAssetsDir = layout.buildDirectory.dir('generated/webAssets')
tasks.register('syncWebAssets', Copy) {
    from rootProject.file('web-prototype')
    include 'index.html'
    include 'app.js'
    include 'native.js'
    include 'native-player.js'
    include 'styles.css'
    include 'fonts.css'
    include 'vendor/hls.min.js'
    into layout.buildDirectory.dir('generated/webAssets/web')
}
tasks.named('preBuild').configure { dependsOn 'syncWebAssets' }

tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

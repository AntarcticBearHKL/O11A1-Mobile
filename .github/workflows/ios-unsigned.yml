name: ios-unsigned

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: expo-ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo-ui/package-lock.json

      - name: Prepare logs
        run: mkdir -p artifacts

      - name: Install JS dependencies
        run: |
          set -o pipefail
          npm ci 2>&1 | tee artifacts/npm-ci.log

      - name: Build web bundle
        run: |
          set -o pipefail
          npm run build:web 2>&1 | tee artifacts/build-web.log

      - name: Generate iOS project
        run: |
          set -o pipefail
          npx expo prebuild --platform ios --clean --no-install 2>&1 | tee artifacts/prebuild.log

      - name: Install CocoaPods
        run: |
          set -o pipefail
          cd ios && pod install 2>&1 | tee ../artifacts/pod-install.log

      - name: Build unsigned device app
        run: |
          set -o pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n 1)"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build-device" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee artifacts/xcodebuild-device.log
          APP="$(find build-device/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$APP"
          mkdir -p artifacts/Payload
          cp -R "$APP" artifacts/Payload/
          (cd artifacts && zip -qry o11a1-ios-unsigned.ipa Payload)

      - name: Publish unsigned IPA (device)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-unsigned >/dev/null 2>&1 || gh release create ios-unsigned --title "iOS unsigned build" --notes "Unsigned IPA and simulator app built from $GITHUB_SHA."
          gh release upload ios-unsigned artifacts/o11a1-ios-unsigned.ipa --clobber

      - name: Build simulator app
        timeout-minutes: 20
        continue-on-error: true
        run: |
          set -o pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n 1)"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/build-sim" \
            build 2>&1 | tee artifacts/xcodebuild-sim.log
          APP="$(find build-sim/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" artifacts/o11a1-ios-simulator.zip

      - name: Publish simulator bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-unsigned >/dev/null 2>&1 || gh release create ios-unsigned --title "iOS unsigned build" --notes "Unsigned IPA and simulator app built from $GITHUB_SHA."
          if [ -f artifacts/o11a1-ios-simulator.zip ]; then
            gh release upload ios-unsigned artifacts/o11a1-ios-simulator.zip --clobber
          fi

      - name: Smoke test in iOS Simulator
        if: success()
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit(1)
          ')"
          echo "simulator=$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP="$(find build-sim/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$APP"
          xcrun simctl install "$DEVICE_ID" "$APP"
          xcrun simctl launch "$DEVICE_ID" com.o11a1.videotest
          sleep 14
          xcrun simctl io "$DEVICE_ID" screenshot artifacts/ios-simulator.png
          xcrun simctl terminate "$DEVICE_ID" com.o11a1.videotest 2>/dev/null || true
          SIMCTL_CHILD_O11A1_TEST_FLOW=player xcrun simctl launch "$DEVICE_ID" com.o11a1.videotest
          sleep 22
          xcrun simctl io "$DEVICE_ID" screenshot artifacts/ios-simulator-player.png
          xcrun simctl spawn "$DEVICE_ID" log show --last 4m --style compact --predicate 'process == "O11A1"' > artifacts/ios-simulator.log 2>&1 || true
          echo "---- simulator log ----"
          tail -n 160 artifacts/ios-simulator.log || true
          xcrun simctl terminate "$DEVICE_ID" com.o11a1.videotest 2>/dev/null || true
          xcrun simctl shutdown "$DEVICE_ID" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: o11a1-ios-unsigned
          path: |
            expo-ui/artifacts/o11a1-ios-unsigned.ipa
            expo-ui/artifacts/o11a1-ios-simulator.zip
            expo-ui/artifacts/ios-simulator.png
            expo-ui/artifacts/ios-simulator-player.png
            expo-ui/artifacts/ios-simulator.log
            expo-ui/artifacts/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish simulator assets
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-unsigned >/dev/null 2>&1 || gh release create ios-unsigned --title "iOS unsigned build" --notes "Unsigned IPA and simulator app built from $GITHUB_SHA."
          shopt -s nullglob
          files=(artifacts/ios-simulator.png artifacts/ios-simulator-player.png artifacts/ios-simulator.log)
          if [ ${#files[@]} -gt 0 ]; then gh release upload ios-unsigned "${files[@]}" --clobber; fi

      - name: Publish failure logs
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(artifacts/*.log artifacts/*.png)
          if [ ${#files[@]} -eq 0 ]; then exit 0; fi
          gh release view ios-build-logs >/dev/null 2>&1 || gh release create ios-build-logs --title "iOS build logs" --notes "Diagnostic logs from failed iOS builds."
          gh release upload ios-build-logs "${files[@]}" --clobber
